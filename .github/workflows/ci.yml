name: CI

on:
  push:
    branches: [yolo]
  pull_request:
    branches: [yolo]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # `nix flake check` exercises every check declared in flake.nix:
      #   - build       (Zig release build)
      #   - test        (zig build test — unit tests)
      #   - cli-test    (tests/cli/test_cli.bash)
      #   - tmux-test   (tests/integration/test_tmux.bash, PTY-driven)
      # tmux is pulled in as a nativeBuildInput only for the tmux-test
      # derivation, so it doesn't bloat the dev shell or other checks.
      - name: nix flake check
        run: nix flake check --print-build-logs
